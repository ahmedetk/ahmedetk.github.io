<script>
  // Any old jamra address (e.g. /jamra/calendar/?area=greece) goes to the same page at the new address.

    var p = location.pathname;
    if (/^\/jamra(\/|$)/.test(p)) {
      location.replace('https://astrobyteps.github.io' + p + location.search + location.hash);
    }
  })();
</script>
